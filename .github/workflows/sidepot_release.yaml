# Builds the Sidepot node for Linux, Windows and macOS and attaches the archives to a GitHub release.
# Runs for a tag named sidepot-v<version>, or by hand (then it only uploads the archives as build artifacts).
name: Sidepot release

on:
  push:
    tags:
      - 'sidepot-v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: ""
            rustflags: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
            rustflags: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
            rustflags: ""
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            suffix: .exe
            rustflags: "-C linker=/usr/bin/x86_64-w64-mingw32-gcc"
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - name: Install the Windows cross-compiler
        if: ${{ matrix.target == 'x86_64-pc-windows-gnu' }}
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add '${{ matrix.target }}'

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: sidepot-${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target '${{ matrix.target }}' -p thunder_app -p thunder_app_cli
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Pack the archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#sidepot-}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) version="dev-${GITHUB_SHA::8}" ;; esac
          name="sidepot-node-${version}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/sidepot-node${{ matrix.suffix }}" \
             "target/${{ matrix.target }}/release/sidepot-node-cli${{ matrix.suffix }}" \
             README.md "$name/"
          if command -v zip >/dev/null; then zip -r "$name.zip" "$name"; else 7z a "$name.zip" "$name"; fi
          if command -v sha256sum >/dev/null; then sha256sum "$name.zip" > "$name.zip.sha256"; else shasum -a 256 "$name.zip" > "$name.zip.sha256"; fi
          echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV"

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          if-no-files-found: error
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

      - name: Release
        uses: softprops/action-gh-release@v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') && contains(github.ref_name, 'rc') }}
